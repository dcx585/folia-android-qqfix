name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Restore source snapshot
        run: |
          if [ -f source-snapshot.tar.gz ]; then
            tar -xzf source-snapshot.tar.gz
          fi
          # 补丁文件在快照之后应用，保证修复一定生效
          ls src/audioNative/qq.ts

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund --ignore-scripts --legacy-peer-deps
          npm ls vite @vitejs/plugin-react --depth=0
          ls node_modules/vite/package.json node_modules/@vitejs/plugin-react/package.json

      - name: Build web assets
        env:
          FOLIA_DISABLE_PWA: '1'
        run: ./node_modules/.bin/vite build -c vite.android.config.ts

      - name: Sync Capacitor
        run: npx cap copy android

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.p12
            echo "keystore restored"
          else
            echo "no keystore secret, falling back to the in-repo debug keystore"
          fi

      - name: Inject signing config
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          if [ -f app/release.p12 ]; then
            cat >> app/build.gradle <<EOF

          android {
              signingConfigs {
                  release {
                      storeFile file('release.p12')
                      storePassword System.getenv('KS_PASSWORD')
                      keyAlias 'foliafix'
                      keyPassword System.getenv('KS_PASSWORD')
                      storeType 'PKCS12'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          fi

      - name: Build APK
        working-directory: android
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Folia-v0.7.21-qqfix.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Folia-v0.7.21-qqfix
          path: out/*.apk

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.7.21-qqfix --yes --cleanup-tag 2>/dev/null || true
          gh release create v0.7.21-qqfix "out/Folia-v0.7.21-qqfix.apk" \
            --title "Folia for Android v0.7.21 (QQ 歌单修复版)" \
            --notes "基于 Timingyyds/folia-android v0.7.21 源码构建。修复 QQ 音乐自建歌单、收藏专辑恒显示「暂无内容」的问题；其余功能与原版一致。" \
            --prerelease
