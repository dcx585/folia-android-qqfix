name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Build web assets
        env:
          FOLIA_DISABLE_PWA: '1'
        run: npx vite build

      - name: Sync Capacitor
        run: npx cap copy android

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.p12
            echo "keystore restored"
          else
            echo "no keystore secret, falling back to in-repo debug keystore"
          fi

      - name: Build APK
        working-directory: android
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -f app/release.p12 ]; then
            cat >> app/build.gradle <<EOF

          android {
              signingConfigs {
                  release {
                      storeFile file('release.p12')
                      storePassword System.getenv('KS_PASSWORD')
                      keyAlias 'foliafix'
                      keyPassword System.getenv('KS_PASSWORD')
                      storeType 'PKCS12'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/Folia-v0.7.21-qqfix.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Folia-v0.7.21-qqfix
          path: out/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v0.7.21-qqfix --yes --cleanup-tag 2>/dev/null || true
          gh release create v0.7.21-qqfix out/Folia-v0.7.21-qqfix.apk \
            --title "Folia for Android v0.7.21 (QQ 歌单修复版)" \
            --notes "基于 Timingyyds/folia-android v0.7.21 源码，修复 QQ 音乐自建歌单与收藏专辑恒为「暂无内容」的问题。" \
            --prerelease
